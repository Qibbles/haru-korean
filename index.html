<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루 한국어 TOPIK I Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one calm column, like a study notebook. Teal (청록) for action, dancheong red for stamps and warnings. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#16211F; --muted:#5B6B68; --line:#D5DEDC;
  --accent:#1D6B66; --accent-soft:#DCEDEA; --stamp:#B8392E; --stamp-soft:#F6E3E0; --gold:#A87914;
  --ok:#2F7D4A; --ok-soft:#E1F1E6;
  --font-display:"Gowun Batang","Noto Serif KR",Georgia,serif;
  --font-body:"IBM Plex Sans","Noto Sans KR",system-ui,sans-serif;
  --font-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1615; --surface:#18211F; --ink:#E6EEEC; --muted:#93A5A1; --line:#2A3735;
  --accent:#5BB8AF; --accent-soft:#1D3431; --stamp:#E57A6E; --stamp-soft:#3A2220; --gold:#D9AE4E;
  --ok:#6CC28B; --ok-soft:#1C3325; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1615; --surface:#18211F; --ink:#E6EEEC; --muted:#93A5A1; --line:#2A3735;
  --accent:#5BB8AF; --accent-soft:#1D3431; --stamp:#E57A6E; --stamp-soft:#3A2220; --gold:#D9AE4E;
  --ok:#6CC28B; --ok-soft:#1C3325; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
.ko{font-family:var(--font-ko)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--font-display);font-size:2rem;margin:0;line-height:1.1;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--accent)}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
nav button{flex:1;background:none;border:0;border-radius:8px;padding:8px 10px;font-weight:500;color:var(--muted);white-space:nowrap}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h2{font-family:var(--font-display);font-size:1.45rem;margin:0 0 4px;text-wrap:balance}
.card h3{margin:0 0 8px;font-size:1rem}
.eyebrow{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 4px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0F1615}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0F1615}}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.btn.small{padding:5px 10px;font-size:.85rem}
.bar{height:8px;background:var(--accent-soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.skip{background:var(--stamp-soft);color:var(--stamp)}
.pill.test{background:var(--accent-soft);color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.stat{font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.toggle{display:flex;align-items:center;gap:10px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
/* course list */
.stage{display:flex;flex-direction:column;gap:6px}
.stage h3{margin:12px 0 4px;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dayrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dayrow .num{font-family:var(--font-display);font-size:1.3rem;text-align:center;color:var(--accent);font-variant-numeric:tabular-nums}
.dayrow.isdone .num{color:var(--ok)}
.dayrow .t{font-weight:500}
.dayrow .s{font-size:.85rem;color:var(--muted)}
.dayrow .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:480px){.dayrow{grid-template-columns:36px 1fr}.dayrow .acts{grid-column:1/-1;justify-content:flex-start}}
/* lesson */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted)}
.step[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.step.fin{color:var(--ok)}
.step.fin::before{content:"✓ "}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.word{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;position:relative}
.word.known{opacity:.55}
.word .big{font-family:var(--font-display);font-size:2rem;line-height:1.15;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.word .rom{color:var(--muted);font-size:.9rem}
.word .en{font-weight:600}
.word .hook{font-size:.88rem;background:var(--accent-soft);border-radius:8px;padding:6px 8px}
.word .zh{font-size:.8rem;color:var(--gold);font-weight:600}
.word .foot{display:flex;justify-content:flex-end;margin-top:auto}
.say{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:32px;height:32px;display:inline-grid;place-items:center;flex:none;padding:0}
.say svg{width:16px;height:16px;fill:var(--accent)}
.say.hidden{display:none}
.phrase{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:0}
.phrase .k{font-family:var(--font-ko);font-size:1.2rem;font-weight:500}
.phrase .r{color:var(--muted);font-size:.88rem}
.phrase .e{font-size:.95rem}
.formula{font-family:var(--font-ko);font-size:1.1rem;background:var(--accent-soft);border-left:4px solid var(--accent);padding:12px 14px;border-radius:8px;margin:12px 0;overflow-x:auto}
.prose{max-width:65ch}
/* quiz */
.q{font-size:1.15rem;font-weight:500;margin:8px 0 14px}
.q .ko{font-size:2rem;font-family:var(--font-display);display:block;margin-top:6px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:1rem}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--stamp);background:var(--stamp-soft)}
.feedback{margin-top:12px;font-size:.95rem}
/* flashcard */
.flash{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer;border:1px dashed var(--line);border-radius:14px;padding:20px}
.flash .big{font-family:var(--font-display);font-size:2.6rem;line-height:1.2}
.flash .hook{background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-size:.9rem;max-width:44ch}
.stamp{display:inline-block;border:2px solid var(--stamp);color:var(--stamp);border-radius:6px;padding:2px 8px;font-weight:700;transform:rotate(-3deg);font-size:.85rem}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.sync{font-size:.78rem;color:var(--muted)}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1 class="ko">하루 한국어</h1>
      <p>TOPIK I in small daily bites · <span class="sync" id="sync">progress saved on this device</span></p>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <nav id="nav" aria-label="Sections">
    <button data-go="home">Today</button>
    <button data-go="course">All days</button>
    <button data-go="review">Review</button>
    <button data-go="exam">The exam</button>
  </nav>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ COURSE DATA ============
   words:   [korean, romanisation, english, memory hook, chinese cognate?]
   phrases: [korean, romanisation, english]
   pattern: {name, formula, explain, ex:[[ko,rom,en]], q:[[prompt, correct, wrong, wrong]]}
*/
const STAGES=[
  {name:"Stage 1 · Reading Hangul",from:1,to:4},
  {name:"Stage 2 · Survival Korean (TOPIK Level 1 core)",from:5,to:10},
  {name:"Stage 3 · Making sentences",from:11,to:19},
  {name:"Stage 4 · Daily life (TOPIK Level 2)",from:20,to:26},
  {name:"Stage 5 · Exam day",from:27,to:27}
];
const DAYS=[
{n:1,kind:"hangul",title:"Vowels, part 1",goal:"Read the 8 basic vowel shapes.",min:8,
words:[
["ㅏ","a","a (as in father)","A stick with an arm pointing right: \"Ah, over there!\""],
["ㅓ","eo","eo (as in son)","Arm points left, back where you came from: \"uh, go back\""],
["ㅗ","o","o (as in go)","Arm points up at the sky: \"Oh! Look up!\""],
["ㅜ","u","u (as in moon)","Arm points down at the ground: \"Ooh, I dropped it\""],
["ㅡ","eu","eu (flat oo, lips spread)","A flat line means flat lips. Say oo while smiling"],
["ㅣ","i","i (as in see)","A standing stick, like the letter i"],
["ㅐ","ae","ae (bed, mouth wider)","ㅏ and ㅣ glued together"],
["ㅔ","e","e (as in bed)","ㅓ and ㅣ glued together. Sounds the same as ㅐ today, so relax"]],
phrases:[["아이","a-i","child"],["오이","o-i","cucumber"],["이","i","two / tooth"]],
pattern:{name:"Building a syllable block",formula:"consonant + vowel   →   ㅇ + ㅏ = 아",
explain:"Korean letters are stacked into blocks, one block per syllable. Every block must start with a consonant. When a syllable starts with a vowel sound, write the silent placeholder ㅇ first.",
ex:[["아","a","the sound a, as a block"],["오","o","the sound o, as a block"],["이","i","the sound i, as a block"]],
q:[["Which letter makes the \"oh\" sound?","ㅗ","ㅜ","ㅓ"],["How do you write the syllable \"a\" on its own?","아","ㅏ","어"],["Which way does the arm on ㅜ (oo) point?","Down","Up","Right"]]}},

{n:2,kind:"hangul",title:"Vowels, part 2",goal:"Add a stroke, get a Y. Glue two vowels, get a W.",min:8,
words:[
["ㅑ","ya","ya (as in yard)","ㅏ with a second arm. Extra stroke = add a y"],
["ㅕ","yeo","yeo (as in young)","ㅓ plus an extra stroke = y + eo"],
["ㅛ","yo","yo (as in yoga)","ㅗ with two legs up: \"Yo!\""],
["ㅠ","yu","yu (as in you)","ㅜ with two legs down: \"you\""],
["ㅘ","wa","wa (as in wow)","ㅗ + ㅏ: o and a slide into wa"],
["ㅝ","wo","wo (as in won)","ㅜ + ㅓ: u and eo slide into wo"],
["ㅚ","oe","we (as in wet)","ㅗ + ㅣ, but just say we"],
["ㅢ","ui","ui (eu + ee, fast)","ㅡ + ㅣ. Say eu-ee quickly"]],
phrases:[["우유","u-yu","milk"],["여우","yeo-u","fox"],["와!","wa","wow!"],["아야!","a-ya","ouch!"],["예","ye","yes (polite)"]],
pattern:{name:"Double stroke = Y sound",formula:"ㅏ→ㅑ    ㅓ→ㅕ    ㅗ→ㅛ    ㅜ→ㅠ",
explain:"You do not need to memorise new letters. Take a vowel you already know and add one more short stroke: it gets a y in front. Two vowels stuck together slide into a w sound.",
ex:[["야","ya","ya"],["요","yo","yo (also the polite ending you will hear everywhere)"],["와","wa","wa"]],
q:[["ㅗ + one extra stroke = ?","ㅛ (yo)","ㅠ (yu)","ㅘ (wa)"],["우유 means…","milk","fox","ouch"],["ㅗ + ㅏ combine into…","ㅘ (wa)","ㅝ (wo)","ㅢ (ui)"]]}},

{n:3,kind:"hangul",title:"Consonants, part 1",goal:"Learn the 10 basic consonants and start reading real words.",min:10,
words:[
["ㄱ","g / k","g (between g and k)","Looks like a gun: G for Gun"],
["ㄴ","n","n","An L lying down, taking a Nap"],
["ㄷ","d / t","d (between d and t)","A Door frame, open on the right"],
["ㄹ","r / l","r / l (light flap)","A zigzag Road. r at the start, l at the end"],
["ㅁ","m","m","A square Mouth: M for Mouth"],
["ㅂ","b / p","b (between b and p)","A Bucket with two handles"],
["ㅅ","s","s","A Ski slope, or a tent: S"],
["ㅇ","– / ng","silent at start, ng at end","A zero: nothing at the start, ng (as in sing) at the end"],
["ㅈ","j","j","ㅅ with a lid on top. A Jogger mid-stride"],
["ㅎ","h","h","A person wearing a Hat: H"]],
phrases:[["나","na","I / me (casual)"],["바다","ba-da","sea"],["나무","na-mu","tree"],["사자","sa-ja","lion"],["하마","ha-ma","hippo"],["머리","meo-ri","head / hair"]],
pattern:{name:"Side by side, or stacked",formula:"tall vowel → side by side (가)    flat vowel → stacked (고)",
explain:"Tall vowels (ㅏ ㅓ ㅣ and their Y versions) sit to the right of the consonant. Flat vowels (ㅗ ㅜ ㅡ) sit underneath. That is the whole layout rule.",
ex:[["가","ga","ㄱ + ㅏ side by side"],["고","go","ㄱ + ㅗ stacked"],["누","nu","ㄴ + ㅜ stacked"]],
q:[["ㅁ + ㅏ = ?","마","모","머"],["나무 means…","tree","sea","lion"],["Which letter is silent at the start of a block?","ㅇ","ㅎ","ㄴ"]]}},

{n:4,kind:"hangul",title:"Consonants, part 2 + bottom letters",goal:"Finish the alphabet. After today you can read any Korean word.",min:10,
words:[
["ㅋ","k","k (strong puff of air)","ㄱ plus an extra stroke = extra air"],
["ㅌ","t","t (strong puff)","ㄷ plus an extra stroke = extra air"],
["ㅍ","p","p (strong puff)","Looks like a picnic table: P for Picnic"],
["ㅊ","ch","ch (strong puff)","ㅈ with a little chef's hat: CH for CHef"],
["ㄲ","kk","kk (tight, no air)","Doubled = tense. Like the k in skate"],
["ㄸ","tt","tt (tight, no air)","Like the t in stop"],
["ㅃ","pp","pp (tight, no air)","Like the p in spy"],
["ㅆ","ss","ss (sharp s)","Two skis hissing down the slope: ss"],
["ㅉ","jj","jj (tight j)","A j said with a tense throat"]],
phrases:[["커피","keo-pi","coffee"],["김치","gim-chi","kimchi"],["빵","ppang","bread"],["한국","han-guk","Korea"],["사랑","sa-rang","love"],["책","chaek","book"]],
pattern:{name:"The bottom letter (받침, batchim)",formula:"consonant + vowel + consonant   →   ㅂ + ㅏ + ㅂ = 밥",
explain:"A consonant can sit at the bottom of a block to close the syllable. Good news for lazy brains: a bottom letter only ever makes one of 7 sounds, k, n, t, l, m, p, ng. So ㅅ ㅈ ㅊ ㅌ ㅎ at the bottom all just sound like t.",
ex:[["밥","bap","rice / meal"],["집","jip","house"],["물","mul","water"],["옷","ot","clothes (ㅅ at the bottom sounds like t)"]],
q:[["옷 (clothes) ends with which sound?","t","s","ng"],["ㅋ ㅌ ㅍ ㅊ are said with…","an extra puff of air","no sound","a nasal hum"],["빵 means…","bread","coffee","love"]]}},

{n:5,title:"Hello, thanks, sorry",goal:"The 10 words you will say every single day in Korea.",min:10,
words:[
["안녕하세요","an-nyeong-ha-se-yo","hello","Literally \"are you at peace?\" Sounds like: \"On young? Hey, say yo!\""],
["감사합니다","gam-sa-ham-ni-da","thank you (formal)","Gamsa = gratitude, hamnida = I do","感谢 gǎnxiè"],
["고마워요","go-ma-wo-yo","thanks (polite, friendly)","\"Go, mow your lawn. Thanks!\""],
["죄송합니다","joe-song-ham-ni-da","I'm very sorry (formal)","\"Sorry, my way-song was off-key\""],
["미안해요","mi-an-hae-yo","sorry (polite)","\"Me, uh, my bad, yo\""],
["네","ne","yes","Sounds like nay but means YES. Classic trap"],
["아니요","a-ni-yo","no","\"Ah, nee-yo\" = ah, no"],
["안녕히 가세요","an-nyeong-hi ga-se-yo","goodbye (to someone leaving)","가 = go. You say it to the person who is GOing"],
["안녕히 계세요","an-nyeong-hi gye-se-yo","goodbye (you leave, they stay)","계 = stay. You leave, they stay"],
["괜찮아요","gwaen-cha-na-yo","it's okay / I'm fine","\"Gwen, chill, yo\""]],
phrases:[["처음 뵙겠습니다","cheo-eum boep-ge-sseum-ni-da","nice to meet you (formal)"],["만나서 반가워요","man-na-seo ban-ga-wo-yo","nice to meet you"],["잘 지냈어요?","jal ji-nae-sseo-yo","how have you been?"],["잘 먹겠습니다","jal meok-ge-sseum-ni-da","said before eating (thanks for the meal)"]],
pattern:{name:"Polite -요 vs formal -ㅂ니다",formula:"…요 = everyday polite        …ㅂ니다 / 습니다 = formal",
explain:"Korean changes the verb ending depending on who you are talking to. Use -요 with strangers, shop staff and colleagues; it is always safe. -ㅂ니다 is extra formal (news, speeches, announcements). It is all over the TOPIK reading paper, so learn to recognise it even if you rarely say it.",
ex:[["고마워요","go-ma-wo-yo","thanks (polite)"],["감사합니다","gam-sa-ham-ni-da","thank you (formal)"],["괜찮습니다","gwaen-chan-sseum-ni-da","it is fine (formal)"]],
q:[["Which ending is the formal one?","-ㅂ니다","-요","-아"],["You are walking out of a shop. You say…","안녕히 계세요","안녕히 가세요","잘 먹겠습니다"],["네 means…","yes","no","hello"]]}},

{n:6,title:"Introducing yourself",goal:"Say who you are, where you're from and what you do.",min:10,
words:[
["저","jeo","I / me (polite)","Humble \"me\". Do a tiny bow when you say it"],
["이름","i-reum","name","\"Ee-room\": your name is on your room door"],
["사람","sa-ram","person","A person RAMming through a crowd"],
["나라","na-ra","country","NARnia is a country"],
["한국","han-guk","Korea","Han + guk (country)","韩国 hánguó"],
["싱가포르","sing-ga-po-reu","Singapore","Just \"Singapore\" spelled in Hangul"],
["학생","hak-saeng","student","Almost the same as Mandarin","学生 xuéshēng"],
["회사원","hoe-sa-won","office worker","회사 company + 원 member"],
["선생님","seon-saeng-nim","teacher","先生 + 님 (an honour ending)","先生 xiānsheng"],
["친구","chin-gu","friend","A friend you clink glasses with: chin-chin!"]],
phrases:[["이름이 뭐예요?","i-reu-mi mwo-ye-yo","what's your name?"],["저는 싱가포르 사람이에요","jeo-neun sing-ga-po-reu sa-ra-mi-e-yo","I'm Singaporean"],["어느 나라 사람이에요?","eo-neu na-ra sa-ra-mi-e-yo","where are you from?"],["직업이 뭐예요?","ji-geo-bi mwo-ye-yo","what do you do (for work)?"]],
pattern:{name:"A는 B이에요 = A is B",formula:"저 + 는  …  회사원 + 이에요   →   저는 회사원이에요",
explain:"This one sentence carries you through day one. 은/는 marks the topic (\"as for me\"). 이에요/예요 means \"is\". Lazy rule for both: after a bottom consonant use the longer one (은, 이에요); after a vowel use the shorter one (는, 예요).",

const TOTAL=DAYS.length;

/* ============ STATE ============ */
const KEY="haru-hangugeo-v1";
const INTERVALS=[0,1,2,4,8,16,32]; // days until next review per box; box 7 = known forever
const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>fmt(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return fmt(d)};
function blank(){return {days:{},secs:{},cards:{},streak:{count:0,last:null},lazy:false,updated:0}}
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw))}catch(e){}

let db=null,uid=null,saveTimer=null,writing=false,pending=false;
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(db&&uid){clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,1200)}
  renderChips();
}
async function pushRemote(){
  if(writing){pending=true;return}
  writing=true;
  try{await db.doc("data/users/"+uid+"/korean").set({json:JSON.stringify(S),updated:S.updated});setSync("synced to your account")}
  catch(e){setSync("saved on this device only")}
  writing=false;
  if(pending){pending=false;pushRemote()}
}
function setSync(t){document.getElementById("sync").textContent="progress "+t}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u)return;
    const id=await u.id(); if(!id)return;
    db=d;uid=id;
    const snap=await db.doc("data/users/"+uid+"/korean").get();
    if(snap.exists){
      const body=snap.data();
      if(body&&body.json&&(body.updated||0)>(S.updated||0)){S=Object.assign(blank(),JSON.parse(body.json));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};render()}
      else if((S.updated||0)>(body.updated||0))pushRemote();
    } else if(S.updated) pushRemote();
    setSync("synced to your account");
  }catch(e){}
})();

/* ============ SPEECH ============ */
let tts=null;
(async()=>{try{if(window.claude&&claude.use)tts=await claude.use("tts")}catch(e){}})();
async function speak(text){
  if(tts){try{await tts.speak(text,{language:"ko",rate:0.85});return}catch(e){if(e&&e.code==="busy")return}}
  try{
    if(!("speechSynthesis" in window))throw 0;
    const u=new SpeechSynthesisUtterance(text);u.lang="ko-KR";u.rate=0.8;
    const v=speechSynthesis.getVoices().find(v=>/^ko/i.test(v.lang));if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){toast("No Korean voice available on this device")}
}
const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sayBtn=t=>/[가-힣]/.test(t)?`<button class="say" data-say="${esc(t)}" aria-label="Play ${esc(t)}">${SPK}</button>`:"";

/* ============ HELPERS ============ */
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2200)}
const dayById=n=>DAYS.find(d=>d.n===n);
const dayStatus=n=>S.days[n]||null; // "done" | "skipped" | "tested"
const isFinished=n=>!!S.days[n];
function nextDay(){return DAYS.find(d=>!isFinished(d.n))||null}
function allCards(day){return day.words.map((w,i)=>({id:day.n+"-w"+i,ko:w[0],rom:w[1],en:w[2],hook:w[3],zh:w[4]})).concat(day.phrases.map((p,i)=>({id:day.n+"-p"+i,ko:p[0],rom:p[1],en:p[2]})))}
function cardById(id){const [n,k]=id.split("-");const d=dayById(+n);if(!d)return null;const i=+k.slice(1);
  if(k[0]==="w"){const w=d.words[i];return w&&{id,ko:w[0],rom:w[1],en:w[2],hook:w[3],zh:w[4],day:d.n}}
  const p=d.phrases[i];return p&&{id,ko:p[0],rom:p[1],en:p[2],day:d.n}}
const lazyWords=d=>S.lazy?d.words.slice(0,5):d.words;
const lazyPhrases=d=>S.lazy?d.phrases.slice(0,2):d.phrases;
function dueCards(){const t=today();return Object.entries(S.cards).filter(([id,c])=>c.box<7&&c.due<=t&&cardById(id)).sort((a,b)=>a[1].due<b[1].due?-1:1).map(([id])=>id)}
function cap(){return S.lazy?10:20}
function addCards(day,box){
  const t=today();
  allCards(day).forEach(c=>{
    if(S.lazy&&!lazyWords(day).some(w=>w[0]===c.ko)&&!lazyPhrases(day).some(p=>p[0]===c.ko))return;
    if(S.cards[c.id]&&S.cards[c.id].box===7)return;
    S.cards[c.id]={box,due:addDays(t,INTERVALS[box]||1)};
  });
}
function markStudied(){
  const t=today();if(S.streak.last===t)return;
  S.streak.count=(S.streak.last===addDays(t,-1))?S.streak.count+1:1;S.streak.last=t;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ============ QUIZ BUILDER ============ */
function wordQuestions(days,count){
  const pool=[];days.forEach(d=>d.words.forEach(w=>pool.push({ko:w[0],rom:w[1],en:w[2],kind:d.kind||"word"})));
  const picked=shuffle(pool).slice(0,count);
  return picked.map(w=>{
    const same=pool.filter(p=>p.kind===w.kind&&p.en!==w.en&&p.ko!==w.ko);
    const others=shuffle(same.length>=3?same:pool.filter(p=>p.en!==w.en&&p.ko!==w.ko));
    const rev=w.kind!=="hangul"&&Math.random()<.4;
    const seen=new Set([rev?w.ko:w.en]);const wrong=[];
    for(const o of others){const v=rev?o.ko:o.en;if(!seen.has(v)){seen.add(v);wrong.push(v)}if(wrong.length===3)break}
    return rev
      ?{prompt:`How do you say “${w.en}”?`,big:"",correct:w.ko,opts:shuffle([w.ko,...wrong]),speak:w.ko}
      :{prompt:"What does this mean?",big:w.ko,correct:w.en,opts:shuffle([w.en,...wrong]),speak:w.ko};
  });
}
function patternQuestions(days,count){
  const q=[];days.forEach(d=>d.pattern.q.forEach(x=>q.push({prompt:x[0],big:"",correct:x[1],opts:shuffle(x.slice(1))})));
  return shuffle(q).slice(0,count);
}

/* ============ VIEWS ============ */
let view={name:"home"};
function go(v){view=v;render();window.scrollTo({top:0})}
function renderChips(){
  const done=DAYS.filter(d=>isFinished(d.n)).length;
  document.getElementById("chips").innerHTML=
    (()=>{const k=S.streak.last&&S.streak.last>=addDays(today(),-1)?S.streak.count:0;return `<span class="chip">Streak <b>${k}</b> day${k===1?"":"s"}</span>`})()+
    `<span class="chip">Due <b>${Math.min(dueCards().length,cap())}</b> cards</span>`+
    `<span class="chip"><b>${done}</b>/${TOTAL} days</span>`;
}
function render(){
  renderChips();
  const tab=view.name==="day"||view.name==="quiz"?(view.from||"course"):view.name;
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===tab?"true":"false"));
  const app=document.getElementById("app");
  app.innerHTML=({home:vHome,course:vCourse,day:vDay,review:vReview,exam:vExam,quiz:vQuiz})[view.name]();
  if(!tts&&!("speechSynthesis" in window))app.querySelectorAll(".say").forEach(b=>b.classList.add("hidden"));
}

function vHome(){
  const d=nextDay();const due=dueCards().length;const done=DAYS.filter(x=>isFinished(x.n)).length;
  const pct=Math.round(done/TOTAL*100);
  const lesson=d?`
    <section class="card">
      <p class="eyebrow">Today's lesson · Day ${d.n} of ${TOTAL} · about ${S.lazy?Math.ceil(d.min/2):d.min} min</p>
      <h2>${esc(d.title)}</h2>
      <p class="muted prose">${esc(d.goal)}</p>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" data-act="open" data-n="${d.n}">Start Day ${d.n}</button>
        <button class="btn" data-act="testout" data-n="${d.n}">Test out (8 questions)</button>
        <button class="btn ghost" data-act="skip" data-n="${d.n}">I already know this, skip</button>
      </div>
    </section>`:`
    <section class="card"><p class="eyebrow">Course complete</p><h2>All ${TOTAL} days done</h2>
    <p class="muted">Keep your reviews going and take a mock quiz in “The exam”. That is what moves you from Level 1 to Level 2.</p>
    <div class="row"><button class="btn primary" data-act="mock">Take a mock quiz</button></div></section>`;
  return `${due?`<section class="card" style="border-color:var(--accent)"><p class="eyebrow">Do this first · 2 minutes</p>
      <h2>${Math.min(due,cap())} cards to review</h2><p class="muted prose">Forgetting is normal. These are words you learned before, timed to come back right before you would lose them.</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="review">Review now</button></div></section>`:""}
    ${lesson}
    <div class="grid2">
      <section class="card">
        <p class="eyebrow">Progress to TOPIK I</p>
        <div class="stat">${pct}%</div>
        <div class="bar" style="margin:10px 0 6px" aria-hidden="true"><i style="width:${pct}%"></i></div>
        <p class="muted" style="margin:0;font-size:.9rem">Day 10 covers Level 1 survival basics. Day 26 covers the Level 2 grammar core. Day 27 is the exam's own vocabulary.</p>
      </section>
      <section class="card">
        <p class="eyebrow">Low-energy day?</p>
        <label class="toggle" for="lazy"><input type="checkbox" id="lazy" ${S.lazy?"checked":""}> <span><b>Lazy mode</b></span></label>
        <p class="muted" style="margin:8px 0 0;font-size:.9rem">Only the 5 most useful words and 2 phrases per day, a 3-question check, and at most 10 reviews. Half the time, still moving forward.</p>
      </section>
    </div>
    <section class="card">
      <p class="eyebrow">How this works for a forgetful brain</p>
      <ul class="prose" style="margin:6px 0 0;padding-left:20px">
        <li>Every word has a silly memory hook, and a Mandarin link where Korean borrowed from Chinese.</li>
        <li>Tap the speaker on anything to hear it. Say it out loud once; that alone doubles recall.</li>
        <li>You never have to re-learn a whole day. Reviews bring back only the words you are about to forget.</li>
        <li>Know something already? Skip a section, skip a day, or test out of it.</li>
      </ul>
    </section>`;
}

function vCourse(){
  return STAGES.map(st=>`<div class="stage"><h3>${esc(st.name)}</h3>${
    DAYS.filter(d=>d.n>=st.from&&d.n<=st.to).map(d=>{
      const s=dayStatus(d.n);
      const pill=s==="done"?'<span class="pill done">Done</span>':s==="tested"?'<span class="pill test">Tested out</span>':s==="skipped"?'<span class="pill skip">Skipped</span>':'<span class="pill">New</span>';
      return `<div class="dayrow ${s?"isdone":""}">
        <div class="num">${d.n}</div>
        <div><div class="t">${esc(d.title)} ${pill}</div><div class="s">${esc(d.goal)}</div></div>
        <div class="acts">
          <button class="btn small ${s?"":"primary"}" data-act="open" data-n="${d.n}">${s?"Revisit":"Start"}</button>
          ${s?`<button class="btn small ghost" data-act="reset" data-n="${d.n}">Undo</button>`:`<button class="btn small" data-act="testout" data-n="${d.n}">Test out</button><button class="btn small ghost" data-act="skip" data-n="${d.n}">Skip</button>`}
        </div></div>`}).join("")
  }</div>`).join("")+`<p class="muted" style="font-size:.85rem">Skipped days add nothing to your reviews. Test out if you want proof you know it; passing adds the words to review at a longer interval.</p>`;
}

const SECS=["Words","Phrases","Pattern","Quick check"];
function vDay(){
  const d=dayById(view.n);const step=view.step||0;const sd=S.secs[d.n]||{};
  const tabs=`<div class="steps" role="tablist">${SECS.map((s,i)=>`<button class="step ${sd[i]?"fin":""}" role="tab" aria-current="${i===step}" data-act="step" data-i="${i}">${s}</button>`).join("")}</div>`;
  let body="";
  if(step===0){
    body=`<p class="muted prose">Read each card once, tap the speaker, say it out loud. Don't try to memorise; the reviews will do that. Tap “I know this” on anything you already know and it will never come back.</p>
    <div class="words">${lazyWords(d).map((w,i)=>{const id=d.n+"-w"+i;const known=S.cards[id]&&S.cards[id].box===7;
      return `<div class="word ${known?"known":""}">
        <div class="big ko">${esc(w[0])} ${sayBtn(w[0])}</div>
        <div class="rom">${esc(w[1])}</div>
        <div class="en">${esc(w[2])}</div>
        ${w[3]?`<div class="hook">${esc(w[3])}</div>`:""}
        ${w[4]?`<div class="zh">漢 ${esc(w[4])}</div>`:""}
        <div class="foot"><button class="btn small ghost" data-act="known" data-id="${id}">${known?"Undo: show in reviews":"I know this"}</button></div>
      </div>`}).join("")}</div>`;
  } else if(step===1){
    body=`<p class="muted prose">Whole phrases you can use as-is. No grammar needed; just borrow them.</p>
    <div>${lazyPhrases(d).map(p=>`<div class="phrase"><div><div class="k">${esc(p[0])}</div><div class="r">${esc(p[1])}</div><div class="e">${esc(p[2])}</div></div>${sayBtn(p[0])}</div>`).join("")}</div>`;
  } else if(step===2){
    const P=d.pattern;
    body=`<h3>${esc(P.name)}</h3><div class="formula">${esc(P.formula)}</div><p class="prose">${esc(P.explain)}</p>
    <div>${P.ex.map(p=>`<div class="phrase"><div><div class="k">${esc(p[0])}</div><div class="r">${esc(p[1])}</div><div class="e">${esc(p[2])}</div></div>${sayBtn(p[0])}</div>`).join("")}</div>`;
  } else {
    body=`<p class="prose">${S.lazy?3:6} quick questions on today's words and pattern. Finishing marks the day done and schedules your reviews. Mistakes don't matter.</p>
    <div class="row"><button class="btn primary" data-act="check" data-n="${d.n}">Start the check</button></div>`;
  }
  const last=step===3;
  return `<section class="card">
    <div class="row" style="justify-content:space-between"><button class="btn ghost small" data-act="back">← ${view.from==="home"?"Today":"All days"}</button>
      <button class="btn ghost small" data-act="skip" data-n="${d.n}">Skip whole day</button></div>
    <p class="eyebrow" style="margin-top:8px">Day ${d.n}</p><h2>${esc(d.title)}</h2>${tabs}</section>
    <section class="card">${body}</section>
    ${last?"":`<div class="row" style="justify-content:flex-end">
      <button class="btn ghost" data-act="skipsec">Skip this section</button>
      <button class="btn primary" data-act="next">Next: ${SECS[step+1]} →</button></div>`}`;
}

function startQuiz(qs,meta){view={name:"quiz",qs,i:0,score:0,answered:null,from:view.from||view.name,...meta};render();window.scrollTo({top:0})}
function vQuiz(){
  const v=view;
  if(v.i>=v.qs.length){
    const pass=v.score>=Math.ceil(v.qs.length*.8);
    let msg="",acts="";
    if(v.mode==="lesson"){msg="Day complete. The words are now in your reviews, starting tomorrow.";acts=`<button class="btn primary" data-act="home">Back to today</button>`}
    else if(v.mode==="testout"){msg=pass?"Passed. Day marked as tested out; its words will pop up occasionally just to check.":"Not quite (you need 80%). Doing the lesson will take about 10 minutes.";
      acts=pass?`<button class="btn primary" data-act="home">Back to today</button>`:`<button class="btn primary" data-act="open" data-n="${v.n}">Do the lesson</button><button class="btn" data-act="home">Later</button>`}
    else {msg=`Rough guide: ${Math.round(v.score/v.qs.length*100)}% here. Aim for 70%+ consistently before booking TOPIK I Level 2.`;acts=`<button class="btn primary" data-act="mock">Another mock quiz</button><button class="btn" data-act="home">Done</button>`}
    return `<section class="card"><p class="eyebrow">Result</p><h2>${v.score} / ${v.qs.length}</h2><p class="prose">${msg}</p><div class="row">${acts}</div></section>`;
  }
  const q=v.qs[v.i];
  const opts=q.opts.map(o=>{let cls="opt";if(v.answered!=null){if(o===q.correct)cls+=" right";else if(o===v.answered)cls+=" wrong"}
    return `<button class="${cls}" data-act="answer" data-v="${esc(o)}" ${v.answered!=null?"disabled":""}><span class="ko">${esc(o)}</span></button>`}).join("");
  return `<section class="card">
    <div class="row" style="justify-content:space-between"><p class="eyebrow" style="margin:0">${esc(v.title)} · ${v.i+1} of ${v.qs.length}</p><button class="btn ghost small" data-act="quitquiz">Quit</button></div>
    <div class="bar" style="margin:10px 0" aria-hidden="true"><i style="width:${v.i/v.qs.length*100}%"></i></div>
    <div class="q">${esc(q.prompt)} ${q.big?`<span class="ko">${esc(q.big)} ${sayBtn(q.big)}</span>`:""}</div>
    <div class="opts">${opts}</div>
    ${v.answered!=null?`<div class="feedback">${v.answered===q.correct?'<span class="stamp">맞아요 · correct</span>':`<span class="stamp">아쉬워요 · answer: ${esc(q.correct)}</span>`}
      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="nextq">${v.i+1<v.qs.length?"Next question":"See result"}</button></div></div>`:""}
  </section>`;
}

let rv=null; // review session
function vReview(){
  if(!rv){
    const ids=dueCards().slice(0,cap());
    if(!ids.length){
      const learned=Object.values(S.cards).filter(c=>c.box<7).length;const known=Object.values(S.cards).filter(c=>c.box===7).length;
      const next=Object.values(S.cards).filter(c=>c.box<7).map(c=>c.due).sort()[0];
      return `<section class="card"><p class="eyebrow">Review</p><h2>Nothing due right now</h2>
      <p class="muted prose">${learned?`You have ${learned} words cycling through reviews and ${known} marked as known. Next ones come back on ${next}.`:"Finish your first lesson and its words will show up here tomorrow."}</p>
      <div class="row"><button class="btn primary" data-act="home">Go to today's lesson</button></div></section>`;
    }
    rv={queue:ids,i:0,flip:false,again:new Set(),seen:new Set()};
  }
  if(rv.i>=rv.queue.length){
    const n=rv.seen.size;rv=null;markStudied();save();
    return `<section class="card"><p class="eyebrow">Review finished</p><h2>${n} cards done</h2><p class="muted">That's today's memory work. Everything else is a bonus.</p>
    <div class="row"><button class="btn primary" data-act="home">Back to today</button></div></section>`;
  }
  const c=cardById(rv.queue[rv.i]);
  return `<section class="card">
    <div class="row" style="justify-content:space-between"><p class="eyebrow" style="margin:0">Review · ${rv.i+1} of ${rv.queue.length}</p><button class="btn ghost small" data-act="endreview">Stop for today</button></div>
    <div class="bar" style="margin:10px 0 16px" aria-hidden="true"><i style="width:${rv.i/rv.queue.length*100}%"></i></div>
    <div class="flash" data-act="flip" role="button" tabindex="0" aria-label="Show answer">
      <div class="big ko">${esc(c.ko)}</div>${sayBtn(c.ko)}
      ${rv.flip?`<div class="muted">${esc(c.rom)}</div><div style="font-weight:600;font-size:1.15rem">${esc(c.en)}</div>${c.hook?`<div class="hook">${esc(c.hook)}</div>`:""}${c.zh?`<div class="zh" style="color:var(--gold);font-weight:600">漢 ${esc(c.zh)}</div>`:""}`
        :`<div class="muted">Try to recall it, then tap to check</div>`}
    </div>
    ${rv.flip?`<div class="row" style="margin-top:14px;justify-content:center">
      <button class="btn" data-act="grade" data-g="0">Forgot</button>
      <button class="btn primary" data-act="grade" data-g="1">Got it</button>
      <button class="btn ghost" data-act="grade" data-g="2">Too easy, never show</button></div>`:""}
  </section>`;
}

function vExam(){
  return `<section class="card"><p class="eyebrow">TOPIK I (Levels 1–2)</p><h2>What the paper looks like</h2>
    <div class="tablewrap"><table><thead><tr><th>Section</th><th>Questions</th><th>Time</th><th>Points</th></tr></thead>
    <tbody><tr><td>Listening (듣기)</td><td>30 multiple choice</td><td>40 min</td><td>100</td></tr>
    <tr><td>Reading (읽기)</td><td>40 multiple choice</td><td>60 min</td><td>100</td></tr>
    <tr><td><b>Total</b></td><td>70</td><td>100 min</td><td>200</td></tr></tbody></table></div>
    <p class="prose" style="margin-top:12px"><b>Level 1</b> = 80 points or more. <b>Level 2</b> = 140 or more. There is no writing or speaking section in TOPIK I, which is why this course trains recognition (reading and listening) rather than producing sentences from scratch.</p>
    <p class="muted" style="font-size:.88rem">Scores above are for the paper test; the internet-based test uses a different scale. Check dates and fees on the official site: <a href="https://www.topik.go.kr" target="_blank" rel="noopener">topik.go.kr</a>.</p></section>
  <section class="card"><p class="eyebrow">Curriculum</p><h2>How the days map to the exam</h2>
    <p class="prose">The topic order follows the beginner levels of Korea's International Standard Korean Curriculum (National Institute of Korean Language), which TOPIK I questions are written around: greetings, self-introduction, numbers and prices, time, places, shopping, food, transport, weather, hobbies, health and family. Days 1–10 cover Level 1 survival basics, Days 11–26 the Level 2 grammar core, and Day 27 the instruction words printed on the paper itself.</p></section>
  <section class="card"><p class="eyebrow">Practice</p><h2>Mock quiz</h2>
    <p class="muted prose">20 mixed questions drawn from the days you have finished (or all days if you have finished fewer than 3).</p>
    <div class="row"><button class="btn primary" data-act="mock">Start mock quiz</button></div></section>
  <section class="card"><p class="eyebrow">Reset</p><p class="muted" style="margin-top:0">Wipe all progress and start from Day 1.</p>
    <div class="row">${view.confirmReset?`<button class="btn" style="border-color:var(--stamp);color:var(--stamp)" data-act="wipe">Yes, wipe everything</button><button class="btn ghost" data-act="cancelwipe">Cancel</button>`:`<button class="btn" data-act="askwipe">Reset progress…</button>`}</div></section>`;
}

/* ============ ACTIONS ============ */
function finishSection(n,i){S.secs[n]=S.secs[n]||{};S.secs[n][i]=1;save()}
function act(a,el){
  const n=+el.dataset.n;
  switch(a){
    case "home":go({name:"home"});break;
    case "review":rv=null;go({name:"review"});break;
    case "open":go({name:"day",n,step:0,from:view.name==="day"||view.name==="quiz"?(view.from||"course"):view.name});break;
    case "back":go({name:view.from||"course"});break;
    case "step":go({...view,step:+el.dataset.i});break;
    case "next":finishSection(view.n,view.step);go({...view,step:view.step+1});break;
    case "skipsec":finishSection(view.n,view.step);toast("Section skipped");go({...view,step:view.step+1});break;
    case "skip":{S.days[n]="skipped";save();toast(`Day ${n} skipped`);const back=view.name==="day"?(view.from||"course"):view.name;go({name:back});break}
    case "reset":delete S.days[n];delete S.secs[n];save();render();break;
    case "known":{const id=el.dataset.id;if(S.cards[id]&&S.cards[id].box===7)delete S.cards[id];else S.cards[id]={box:7,due:"9999-12-31"};save();render();break}
    case "testout":{const d=dayById(n);startQuiz(wordQuestions([d],6).concat(patternQuestions([d],2)),{mode:"testout",n,title:`Test out of Day ${n}`});break}
    case "check":{const d=dayById(n);const k=S.lazy?3:6;const pq=Math.min(2,Math.max(1,Math.floor(k/3)));
      const qs=wordQuestions([{...d,words:lazyWords(d)}],k-pq).concat(patternQuestions([d],pq));
      startQuiz(qs,{mode:"lesson",n,title:`Day ${n} check`,from:view.from});break}
    case "mock":{let ds=DAYS.filter(d=>isFinished(d.n));if(ds.length<3)ds=DAYS;startQuiz(shuffle(wordQuestions(ds,14).concat(patternQuestions(ds,6))),{mode:"mock",title:"Mock quiz",from:"exam"});break}
    case "answer":{if(view.answered!=null)return;const v=el.dataset.v;view.answered=v;const q=view.qs[view.i];if(v===q.correct)view.score++;if(q.speak&&v===q.correct)speak(q.speak);render();break}
    case "nextq":{view.i++;view.answered=null;
      if(view.i>=view.qs.length){
        if(view.mode==="lesson"){S.days[view.n]="done";finishSection(view.n,3);addCards(dayById(view.n),1);markStudied();save()}
        else if(view.mode==="testout"&&view.score>=Math.ceil(view.qs.length*.8)){S.days[view.n]="tested";addCards(dayById(view.n),3);markStudied();save()}
      }
      render();break}
    case "quitquiz":go({name:view.mode==="lesson"?"day":(view.from||"home"),n:view.n,step:3,from:view.from});break;
    case "flip":if(!rv.flip){rv.flip=true;render()}break;
    case "grade":{const id=rv.queue[rv.i];const c=S.cards[id];const g=+el.dataset.g;const t=today();
      rv.seen.add(id);
      if(g===0){c.box=1;c.due=addDays(t,1);if(!rv.again.has(id)){rv.again.add(id);rv.queue.push(id)}}
      else if(g===1){if(!rv.again.has(id)){c.box=Math.min(6,c.box+1);c.due=addDays(t,INTERVALS[c.box])}}
      else {c.box=7;c.due="9999-12-31"}
      rv.i++;rv.flip=false;save();render();break}
    case "endreview":rv.i=rv.queue.length;render();break;
    case "askwipe":view.confirmReset=true;render();break;
    case "cancelwipe":view.confirmReset=false;render();break;
    case "wipe":S=blank();save();rv=null;toast("Progress reset");go({name:"home"});break;
  }
}
document.addEventListener("click",e=>{
  const say=e.target.closest("[data-say]");if(say){e.stopPropagation();speak(say.dataset.say);return}
  const nav=e.target.closest("[data-go]");if(nav){rv=null;go({name:nav.dataset.go});return}
  const el=e.target.closest("[data-act]");if(el)act(el.dataset.act,el);
});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".flash")){e.preventDefault();act("flip",e.target)}
});
document.addEventListener("change",e=>{if(e.target.id==="lazy"){S.lazy=e.target.checked;save();render();toast(S.lazy?"Lazy mode on":"Lazy mode off")}});
if("speechSynthesis" in window){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}
render();
</script>
